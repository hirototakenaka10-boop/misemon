<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>モンスタートレイル</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
body{margin:0;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif;background:#000}
canvas{display:block}
.hide{display:none!important}
#hud{position:fixed;top:10px;left:10px;color:#fff;text-shadow:0 2px 4px #000a;pointer-events:none;max-width:70vw}
#hud h1{margin:0;font-size:20px}
#score{font-size:14px}
#team{margin-top:6px;font-size:13px;line-height:1.5}
#help{position:fixed;bottom:10px;right:10px;color:#fff;font-size:12px;text-shadow:0 1px 3px #000a;pointer-events:none;text-align:right}
#dexbtn{position:fixed;top:10px;right:10px}#bgmbtn{position:fixed;top:10px;right:130px}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#fffe;padding:10px 20px;border-radius:20px;font-weight:bold;pointer-events:none;transition:opacity .4s;opacity:0;white-space:nowrap}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#3a7bd5cc,#1a2a6ccc);color:#fff;text-align:center;padding:20px}
.ov h1{font-size:40px;margin:0 0 10px;text-shadow:0 4px 0 #0005}
.btn{font:inherit;font-weight:bold;font-size:16px;padding:12px 18px;margin:6px;border:none;border-radius:14px;background:#fff;color:#234;box-shadow:0 4px 0 #0004;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0004}
.btn:disabled{opacity:.35}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.hpbox{position:fixed;background:#fffe;border-radius:12px;padding:8px 12px;width:230px;box-shadow:0 4px 0 #0003;font-size:14px}
#wbox{top:14px;left:14px}#abox{top:14px;right:14px}
.bar{height:10px;background:#ccc;border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:#3c3;transition:width .4s,background .4s}
#msg{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);width:min(94vw,640px);background:#fffe;border:3px solid #345;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:bold;min-height:48px}
#cmds{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);width:min(94vw,640px)}
#cmds .btn{margin:3px;padding:8px 2px;font-size:12px}
#cmds .mv{background:#fff6d0}
#cmds.off .btn{opacity:.4;pointer-events:none}
#pad{position:fixed;left:16px;bottom:16px;width:150px;height:150px}
#pad button{position:absolute;width:50px;height:50px;border-radius:12px;border:none;background:#fff8;font-size:22px}
#dex{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none}
#dextop{height:46vh;display:flex;align-items:flex-end;justify-content:center;padding:10px}
#dexinfo{background:#fffe;border-radius:14px;padding:8px 16px;font-weight:bold;text-align:center;box-shadow:0 4px 0 #0003}
#dexlist{flex:1;overflow-y:auto;background:#1a2a6cee;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;align-content:start;pointer-events:auto;touch-action:pan-y}
#dexlist button{font:inherit;font-size:12px;padding:6px 2px;border:none;border-radius:8px;background:#fff;color:#234;cursor:pointer}
#dexlist button.no{background:#556;color:#ccd}
#dexclose{position:fixed;top:10px;right:10px;pointer-events:auto}
#shop{background:radial-gradient(#3ab0d5dd,#1a4a6cdd)}
#pc{background:radial-gradient(#3ad59add,#1a6c4add)}
.pcl{display:flex;flex-wrap:wrap;justify-content:center;max-height:28vh;overflow-y:auto;touch-action:pan-y;background:#0003;border-radius:12px;padding:6px;margin:4px;width:min(94vw,700px)}
.pcl b{width:100%}
.pcl button{font:inherit;font-size:12px;margin:3px;padding:6px 8px;border:none;border-radius:8px;background:#fff;color:#234;cursor:pointer}
.pcl .sel{background:#ffd700}
</style>
</head>
<body>
<div id="hud"><h1>🌿 モンスタートレイル</h1><div id="score"></div><div id="team"></div></div>
<button class="btn" id="dexbtn">📖 ずかん</button><button class="btn" id="bgmbtn">🔊</button>
<div id="help">矢印/WASDで移動・草むらでモンスター出現・🎁アイテム・⭐まれに色違い<br>✨回復・💻ボックス・🏪ショップ・🏟️ジム・⛰️北に伝説・🌊みずタイプがいれば西の海をなみのり</div>
<div id="pad"><button data-k="up" style="left:50px;top:0">▲</button><button data-k="left" style="left:0;top:50px">◀</button><button data-k="right" style="left:100px;top:50px">▶</button><button data-k="down" style="left:50px;top:100px">▼</button></div>
<div id="toast"></div>
<div id="battle" class="hide">
 <div class="hpbox" id="wbox"><b id="wname"></b> <span id="wlv"></span><div class="bar"><i id="whp"></i></div></div>
 <div class="hpbox" id="abox"><b id="aname"></b> <span id="alv"></span><div class="bar"><i id="ahp"></i></div><small id="ahpt"></small></div>
 <div id="msg"></div>
 <div id="cmds"><button class="btn mv" id="m0"></button><button class="btn mv" id="m1"></button><button class="btn mv" id="m2"></button><button class="btn mv" id="m3"></button><button class="btn" id="bcatch">🔴 ボール</button><button class="btn" id="bsuper"></button><button class="btn" id="bhyp"></button><button class="btn" id="bpot"></button><button class="btn" id="bswap">🔄 いれかえ</button><button class="btn" id="brun">🏃 にげる</button></div>
</div>
<div id="dex" class="hide"><div id="dextop"><div id="dexinfo"></div></div><div id="dexlist"></div><button class="btn" id="dexclose">✖ とじる</button></div>
<div id="shop" class="ov hide"><h1>🏪 フレンドリィショップ</h1><p id="shoptxt"></p>
 <div><button class="btn" data-b="pot" data-p="100">🧪 キズぐすり 100💰</button><button class="btn" data-b="sup" data-p="200">🔵 スーパーボール 200💰</button><button class="btn" data-b="hyp" data-p="500">🟡 ハイパーボール 500💰</button></div>
 <button class="btn" id="shopclose">👋 またきてね</button></div>
<div id="pc" class="ov hide"><h1>💻 モンスターボックス</h1><p id="pctxt"></p><div id="pcteam" class="pcl"></div><div id="pcbox" class="pcl"></div>
 <div><button class="btn" id="pcdep">⬇ あずける</button><button class="btn" id="pcclose">👋 とじる</button></div></div>
<div id="title" class="ov"><h1>🌿 モンスタートレイル</h1><p>151匹のモンスターを集めて、進化させて、ジムと伝説のボスに挑もう！<br>⭐色違いや、海の向こうのひみつのしまも探してみてね。最初のあいぼうを選んでね</p><div id="starters"></div></div>
<div id="over" class="ov hide"><h1>めのまえが まっしろに…</h1><p id="ovtxt"></p><button class="btn" id="retry">もういちど</button></div>
<div id="flash"></div>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd8ff);scene.fog=new THREE.Fog(0x9fd8ff,35,90);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,300);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8a50,1.3);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e0,2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,far:80});scene.add(sun,sun.target);
const ri=n=>Math.floor(Math.random()*n);

let seed=20240;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
const TYPES=['fire','water','grass','elec','rock','fairy','ice'];
const PRE={fire:['ヒノ','ホム','カエ','ボル','アカ'],water:['ミズ','アク','シズ','ナミ','アワ'],grass:['ハッ','モリ','クサ','ツタ','メブ'],elec:['ピリ','ビリ','イナ','デン','パチ'],rock:['イワ','ゴロ','ガン','セキ','ドテ'],fairy:['フワ','キラ','ユメ','ルル','ポワ'],ghost:['ヨル','カゲ','オボ','ユラ','ヒュド'],ice:['ユキ','コオ','ヒョウ','シモ','ツラ']};
const MID=['ラ','モ','ク','ナ','テ','リ','ゴ','ピ','ム','ト','サ','ボ','ニ','ズ','ノ','マ'];
const SUF=[['ン','ポ','コ','チ','ミ','ピー','ル'],['ロン','ドル','ガル','リオ','バス','ネル','ザン'],['ドン','ギガス','オウ','ドラス','キング','ゼウス','ノヴァ']];
const MV={fire:['🔥 ひのこ','🔥 かえんほうしゃ'],water:['💧 みずでっぽう','💧 ハイドロウェーブ'],grass:['🍃 はっぱカッター','🍃 ソーラーブラスト'],elec:['⚡ でんきショック','⚡ かみなりドーン'],rock:['🪨 いわおとし','🪨 ストーンエッジ'],fairy:['✨ ようせいのかぜ','✨ ムーンシャワー'],ghost:['👻 おどろかす','👻 シャドーボール'],ice:['❄️ こなゆき','❄️ ふぶきストーム']};
const COVER={fire:'rock',water:'ice',grass:'fairy',elec:'fairy',rock:'grass',fairy:'water',ghost:'elec',ice:'water'};
const HUE={fire:.03,water:.58,grass:.32,elec:.14,rock:.08,fairy:.88,ghost:.75,ice:.52};
const TNAME={fire:'ほのお',water:'みず',grass:'くさ',elec:'でんき',rock:'いわ',fairy:'フェアリー',ghost:'ゴースト',ice:'こおり'};
const hsl=(h,s,l)=>new THREE.Color().setHSL(h,s,l).getHex();
const SP=[],used=new Set();
for(let f=0;f<50;f++){
 const t=f<3?['fire','water','grass'][f]:f%8===7?'ghost':pick(TYPES),base=pick(PRE[t])+pick(MID);
 const h=(HUE[t]+(rnd()-.5)*.08+1)%1,ear=Math.floor(rnd()*3),tail=rnd()<.6,wing=rnd()<.35||t==='fairy'||t==='ghost',bs=[.8+rnd()*.45,.8+rnd()*.35],sat=t==='rock'?.25:t==='ice'?.45:.65;
 const e1=f<3?10:12+Math.floor(rnd()*6),e2=e1+12+Math.floor(rnd()*6),ec=hsl((h+.45+rnd()*.2)%1,.5,.45);
 for(let s=0;s<3;s++){let n,k=0;do{n=(s===2&&rnd()<.35?'メガ':'')+base+pick(SUF[s])+(k++>4?MID[k%16]:'')}while(used.has(n));used.add(n);
  SP.push({no:SP.length+1,n,t,st:s,c:hsl(h,sat,(t==='ice'?.75:.62)-s*.08),e:ec,m:MV[t][s>1?1:0],pw:s>1?75:55,ear,tail,wing:wing&&s>0,horn:s===2,bs,size:[.8,1,1.25][s],evo:[e1,e2,0][s],next:s<2?SP.length+1:-1})}}
SP.push({no:151,n:'ニジノオウ',t:'fairy',st:2,c:0xfff0ff,e:0x8a6dff,m:'🌈 にじのさばき',pw:90,ear:0,tail:true,wing:true,horn:true,bs:[1,1],size:1.4,evo:0,next:-1,leg:true});
const BOSS={no:0,n:'ガイアドラゴン',t:'rock',st:2,c:0x6a5a8a,e:0xffb040,m:'🌋 ガイアクエイク',pw:85,ear:0,tail:true,wing:true,horn:true,bs:[1.2,1.1],size:1.6,evo:0,next:-1,leg:true};
const STRONG={fire:['grass','ice'],water:['fire','rock'],grass:['water','rock'],elec:['water'],rock:['fire','elec','ice'],fairy:['ghost'],ghost:['fairy','ghost'],ice:['grass']};
const eff=(a,d)=>a==='normal'?1:STRONG[a].includes(d)?1.6:STRONG[d].includes(a)?0.7:1;
const TCOL={fire:0xff7a20,water:0x40b0ff,grass:0x60e060,elec:0xffff40,rock:0xaa9070,fairy:0xffa0ff,ghost:0x9040ff,ice:0xb0f0ff,normal:0xffffff};
const learnset=sp=>{const c=COVER[sp.t];return[[1,{n:'💥 たいあたり',t:'normal',p:40}],[1,{n:MV[sp.t][0],t:sp.t,p:55}],[8,{n:MV[c][0],t:c,p:50}],[16,sp.leg?{n:sp.m,t:sp.t,p:sp.pw}:{n:MV[sp.t][1],t:sp.t,p:80}]]};
const mkData=(sp,lv,shiny=false)=>{const max=18+lv*4+sp.st*6;return{sp,lv,hp:max,max,exp:0,shiny,mv:learnset(sp).filter(x=>x[0]<=lv).map(x=>x[1])}};
const shinyC=c=>new THREE.Color(c).offsetHSL(.45,.1,.05).getHex();

const WTH={sun:{n:'☀️ はれ',mod:{fire:1.3}},rain:{n:'☔ あめ',mod:{water:1.5,elec:1.2,fire:.6},bias:['water','elec']},snow:{n:'❄️ ゆき',mod:{ice:1.5,grass:.8},bias:['ice']}};
let weather='sun',wTimer=40;
const PN=1500,pa=new Float32Array(PN*3);for(let i=0;i<PN;i++){pa[i*3]=(Math.random()-.5)*50;pa[i*3+1]=Math.random()*20;pa[i*3+2]=(Math.random()-.5)*50}
const pgeo=new THREE.BufferGeometry();pgeo.setAttribute('position',new THREE.BufferAttribute(pa,3));
const precip=new THREE.Points(pgeo,new THREE.PointsMaterial({color:0x9ac8ff,size:.12,transparent:true,opacity:.85}));precip.visible=false;precip.frustumCulled=false;scene.add(precip);
const GRAY=new THREE.Color(0x707888);

let AC,bgmOn=true,bTrack='',bStep=0,nt=0;
function snd(f,d=.15,type='square',v=.08,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
const melody=(ns,st=.1,ty='square')=>ns.forEach((n,i)=>setTimeout(()=>snd(n,.18,ty,.07),i*st*1000));
const TR={
 day:{bpm:132,w:'square',v:.022,l:[72,0,76,79,77,76,74,0,72,74,76,79,81,79,76,0],b:[48,55,53,55,48,55,57,55]},
 night:{bpm:84,w:'sine',v:.04,l:[69,0,72,0,76,0,74,72,71,0,67,0,69,0,0,0],b:[45,45,41,41,43,43,45,40]},
 beach:{bpm:110,w:'triangle',v:.05,l:[77,81,84,81,79,0,76,79,77,0,74,77,76,72,74,0],b:[41,48,46,48,43,50,48,43]},
 cave:{bpm:96,w:'triangle',v:.05,l:[62,0,0,65,0,0,63,0,62,0,0,58,0,60,0,0],b:[38,38,38,38,36,36,37,37]},
 battle:{bpm:168,w:'sawtooth',v:.016,l:[69,72,76,72,77,76,72,69,71,74,77,74,79,77,74,71],b:[45,45,45,45,43,43,44,44]},
 boss:{bpm:184,w:'sawtooth',v:.018,l:[62,65,62,68,62,67,65,63,62,65,62,70,69,67,65,61],b:[38,38,38,38,37,37,36,36]},
 shop:{bpm:120,w:'triangle',v:.05,l:[76,79,84,79,77,81,86,81,76,79,84,88,86,83,79,0],b:[48,52,53,57,48,52,55,59]}};
function tone(n,t,d,w,v){const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=440*2**((n-69)/12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const curTrack=()=>state==='battle'?(isBoss?'boss':'battle'):state==='shop'||state==='pc'?'shop':state==='field'?(['beach','sea','island'].includes(zone)?'beach':zone==='cave'?'cave':night||weather!=='sun'?'night':'day'):'day';
setInterval(()=>{if(!AC||!bgmOn)return;const k=curTrack();if(k!==bTrack){bTrack=k;bStep=0;nt=AC.currentTime+.05}const tr=TR[k],sd=60/tr.bpm/2;
 if(nt<AC.currentTime)nt=AC.currentTime+.02;
 while(nt<AC.currentTime+.15){const s=bStep%16,n=tr.l[s];if(n)tone(n,nt,sd*.9,tr.w,tr.v);if(s%2===0)tone(tr.b[(s/2)%8],nt,sd*1.8,'triangle',.06);nt+=sd;bStep++}},30);

const G={body:new THREE.SphereGeometry(1,24,16),eye:new THREE.SphereGeometry(.17,12,8),pupil:new THREE.SphereGeometry(.09,8,6),ear:new THREE.ConeGeometry(.3,.8,8),foot:new THREE.SphereGeometry(.3,10,8),p:new THREE.SphereGeometry(.12,6,4),trunk:new THREE.CylinderGeometry(.3,.4,2,8),crown:new THREE.ConeGeometry(1.8,3.5,8),stick:new THREE.CylinderGeometry(.04,.04,.7,6),
 hb:new THREE.CylinderGeometry(.4,.5,1.1,12),hh:new THREE.SphereGeometry(.42,16,12),cap:new THREE.SphereGeometry(.45,16,8,0,6.28,0,1.6),brim:new THREE.CylinderGeometry(.3,.3,.06,12),rock:new THREE.DodecahedronGeometry(1),box:new THREE.BoxGeometry(.6,.6,.6),rib:new THREE.BoxGeometry(.64,.64,.16)};
const MC={};const mat=c=>MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,roughness:.55}));
function makeMon(sp,sh=false){
 const g=new THREE.Group(),inn=new THREE.Group();g.add(inn);inn.scale.setScalar(sp.size);
 const C=sh?shinyC(sp.c):sp.c,E=sh?shinyC(sp.e):sp.e;
 const add=(geo,c,x,y,z,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;inn.add(m);return m};
 const [bw,bh]=sp.bs,top=1+bh*.9;
 add(G.body,C,0,1,0,bw,bh*.9,bw);add(G.body,0xfff4d6,0,.85,.6*bw,.6*bw,.5*bh,.42);
 for(const s of[-1,1]){add(G.eye,0xffffff,s*.35,1.2,.84*bw);add(G.pupil,0x222222,s*.36,1.22,.84*bw+.14);
  if(sp.ear===0){const e=add(G.ear,E,s*.5,top,0);e.rotation.z=-s*.4}
  else if(sp.ear===1)add(G.foot,E,s*.6,top-.1,0,1.1,1.1,.8);
  else{const a=add(G.stick,0x333333,s*.3,top+.25,0);a.rotation.z=-s*.3;add(G.eye,E,s*.42,top+.6,0)}
  if(sp.wing){const w=add(G.body,E,s*(bw+.1),1.3,-.3,.08,.5,.7);w.rotation.z=s*.6}
  add(G.foot,E,s*.45,.2,.3,1,.7,1.2);add(G.body,0xff8fa0,s*.6,1.02,.68*bw,.12,.08,.05)}
 if(sp.tail){const tl=add(G.ear,E,0,.8,-bw-.2,.8,1.2,.8);tl.rotation.x=-2}
 if(sp.horn)add(G.ear,sp.no===151?0xffffff:0xffe060,0,top+.25,.3,.5,.9,.5);
 if(sh)add(G.p,0xffe040,.7,top+.3,.3,1.3,1.3,1.3);
 g.userData.inn=inn;return g}

const field=new THREE.Group();scene.add(field);
const gtex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#7ccf5a';x.fillRect(0,0,128,128);for(let i=0;i<400;i++){x.fillStyle=`hsl(${95+Math.random()*25},55%,${45+Math.random()*15}%)`;x.fillRect(Math.random()*128,Math.random()*128,2,2)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(26,26);t.colorSpace=THREE.SRGBColorSpace;return t})();
const flat=(w,h,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),c.isMaterial?c:mat(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;field.add(m);return m};
const groundMat=new THREE.MeshStandardMaterial({map:gtex});flat(160,160,groundMat,0,0,0);
flat(32,160,0xf2e0a8,-50,.02,0);
flat(160,30,0x8a8494,0,.03,50);
const water=flat(60,160,new THREE.MeshStandardMaterial({color:0x2a9ff0,transparent:true,opacity:.85,roughness:.1,metalness:.3}),-80,.1,0);
{const p=new THREE.Mesh(new THREE.CircleGeometry(5,32),mat(0xe8d6a0));p.rotation.x=-Math.PI/2;p.position.y=.04;p.receiveShadow=true;field.add(p)}

   else if(bossCD<0&&Math.hypot(P.x-BX,P.z-BZ)<3.6){bossCD=99;startBattle('boss')}}
  else if(state==='field'&&pcCD<0&&Math.hypot(P.x-PCX,P.z-PCZ)<1.7){pcCD=99;openPC()}
  healCD-=dt;if(state==='field'&&healCD<0&&Math.hypot(P.x-crystal.position.x,P.z-crystal.position.z)<1.8&&team.some(m=>m.hp<m.max)){team.forEach(m=>m.hp=m.max);healCD=2;melody([523,659,784,1047,1319],.08,'sine');burst(crystal.position,0x80ffff,40,6);toast('みんな げんきに なった！');setFollowers();hud()}
  if(state==='title'){camT.set(Math.sin(t*.2)*20,12,Math.cos(t*.2)*20);cam.position.lerp(camT,.05);cam.lookAt(0,1,0)}
  else{camT.set(P.x,P.y+13,P.z+12);cam.position.lerp(camT,Math.min(1,dt*5));cam.lookAt(P.x,1,P.z)}
  sun.position.set(P.x+12,25,P.z+10);sun.target.position.set(P.x,0,P.z);
  if(Math.random()<dt*2&&state==='field')hud()}
 else if(state==='battle'){
  if(wMesh){wMesh.userData.inn.position.y=Math.abs(Math.sin(t*3))*.15;if(wild&&wild.shiny&&Math.random()<dt*3)burst(WPOS.clone().setY(1.5+Math.random()),0xffe040,3,2)}
  if(aMesh)aMesh.userData.inn.position.y=Math.abs(Math.sin(t*3+1))*.15;
  cam.position.set(AX-8+Math.sin(t*.3)*.6,isBoss?5.2:4.2,isBoss?10.5:9);cam.lookAt(AX+.5,isBoss?1.6:1,-1)}
 else if(state==='dex'){if(dexMesh){dexMesh.rotation.y+=dt*1.2;dexMesh.userData.inn.position.y=Math.abs(Math.sin(t*3))*.15}
  cam.position.set(DX,2.4,6.5);cam.lookAt(DX,-.6,0)}
 if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.5)}
 R.render(scene,cam)}
loop();
</script>
